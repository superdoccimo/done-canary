name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: false
      - name: Audit public tree, history and release metadata
        run: python3 scripts/public-release-audit.py
      - name: Verify formatting and whitespace
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*' -print))"
          git diff --check

  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/done-canary

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: false
      - run: go test -race ./...

  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target_os: windows
          - runner: ubuntu-latest
            target_os: linux
          - runner: macos-latest
            target_os: darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: false
      - name: Verify release version guards
        shell: pwsh
        run: ./scripts/package-version-test.ps1
      - name: Build native-format rc.3 package
        shell: pwsh
        run: ./scripts/package.ps1 -Version 0.1.0-rc.3 -TargetOS ${{ matrix.target_os }} -TargetArch amd64
      - name: Upload target package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: done-canary-package-${{ matrix.target_os }}
          path: dist/done-canary-v0.1.0-rc.3/*
          if-no-files-found: error

  bundle:
    timeout-minutes: 15
    needs: [audit, test, race, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: done-canary-package-*
          path: release-bundle
          merge-multiple: true
      - name: Verify archive contents, modes, versions and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-bundle
          rm -f -- *.sha256

          expected=(
            done-canary-v0.1.0-rc.3-windows-amd64.zip
            done-canary-v0.1.0-rc.3-linux-amd64.tar.gz
            done-canary-v0.1.0-rc.3-darwin-amd64.tar.gz
          )
          for archive in "${expected[@]}"; do
            test -f "$archive"
          done
          test "$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 3

          printf '%s\n' LICENSE README.md SECURITY.md done-canary | sort > expected-posix.txt
          for archive in *-linux-amd64.tar.gz *-darwin-amd64.tar.gz; do
            tar -tzf "$archive" | sed 's#^\./##' | sort > actual.txt
            diff -u expected-posix.txt actual.txt
            mode="$(tar -tvzf "$archive" | awk '$NF == "done-canary" {mode=$1} END {print mode}')"
            case "$mode" in
              *x*) ;;
              *) echo "Executable mode missing in $archive: $mode" >&2; exit 1 ;;
            esac
          done

          printf '%s\n' LICENSE README.md SECURITY.md done-canary.exe | sort > expected-windows.txt
          unzip -Z1 done-canary-v0.1.0-rc.3-windows-amd64.zip | sort > actual.txt
          diff -u expected-windows.txt actual.txt

          mkdir -p inspect/linux inspect/darwin inspect/windows
          tar -xzf done-canary-v0.1.0-rc.3-linux-amd64.tar.gz -C inspect/linux
          tar -xzf done-canary-v0.1.0-rc.3-darwin-amd64.tar.gz -C inspect/darwin
          unzip -q done-canary-v0.1.0-rc.3-windows-amd64.zip -d inspect/windows
          test "$(inspect/linux/done-canary version)" = "done-canary 0.1.0-rc.3"
          for binary in inspect/linux/done-canary inspect/darwin/done-canary inspect/windows/done-canary.exe; do
            go version -m "$binary" | grep -F 'path' | grep -F 'github.com/superdoccimo/done-canary/cmd/done-canary'
            go version -m "$binary" | grep -F 'vcs.modified=false'
          done

          sha256sum "${expected[@]}" > checksums-sha256.txt
          sha256sum -c checksums-sha256.txt
          rm -rf inspect expected-posix.txt expected-windows.txt actual.txt
      - name: Upload verified release-candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: done-canary-v0.1.0-rc.3
          path: release-bundle/*
          if-no-files-found: error
